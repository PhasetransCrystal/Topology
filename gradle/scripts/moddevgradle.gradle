test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// A separate development mod: never part of main's jar, sources jar, or publication.
sourceSets {
    demo {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    demoImplementation.extendsFrom implementation
    demoCompileOnly.extendsFrom compileOnly
    demoRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    // 指定要使用的NeoForge版本。
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.demo)

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        topodemo {
            sourceSet(sourceSets.demo)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            gameDirectory.set(file('run/client'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory.set(file('run/server'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()
            ideName = "clientData"
            gameDirectory.set(file('run/clientData'))
            programArguments.addAll('--mod', project.mod_id)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
        }
        serverData {
            serverData()
            ideName = "serverData"
            gameDirectory.set(file('run/serverData'))
            programArguments.addAll('--mod', project.mod_id)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
        }

        contentClientData {
            clientData()
            ideName = "contentClientData"
            gameDirectory.set(file('run/contentClientData'))
            programArguments.addAll('--mod', 'topodemo', '--all')
            programArguments.addAll('--output', file('src/demo/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/demo/resources/').getAbsolutePath())
        }
        contentServerData {
            serverData()
            ideName = "contentServerData"
            gameDirectory.set(file('run/contentServerData'))
            programArguments.addAll('--mod', 'topodemo', '--all')
            programArguments.addAll('--output', file('src/demo/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/demo/resources/').getAbsolutePath())
        }

        configureEach {
            // ModDevGradle otherwise loads every declared source mod, including in datagen.
            loadedMods = [project.neoForge.mods.getByName(project.mod_id)]
            if (name in ['client', 'server', 'contentClientData', 'contentServerData']) {
                loadedMods.add(project.neoForge.mods.getByName('topodemo'))
            }
            // 用户开发环境推荐的日志数据
            // 可以按需添加/移除标记，用逗号分隔。
            // "SCAN"：用于mod扫描
            // "REGISTRIES"：用于触发注册表事件
            // "REGISTRYDUMP"：用于获取所有注册表内容
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
        loadedMods = [mods.getByName(mod_id)]
    }
}

// Keep the normal datagen entry points complete while preserving separate output roots.
tasks.named('runClientData') {
    dependsOn 'runContentClientData'
}
tasks.named('runServerData') {
    dependsOn 'runContentServerData'
}

name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm publishing'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirm == 'release'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_BUILD: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Resolve build version
        id: version
        run: |
          VERSION=$(./gradlew -q printBuildVersion --no-daemon 2>/dev/null)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_buildVersion=$VERSION" >> "$GITHUB_ENV"
      - name: Generate resources
        run: |
          chmod +x gradlew
          ./gradlew clean runClientData --no-daemon --build-cache
      - name: Build and publish
        run: |
          chmod +x gradlew
          ./gradlew build publish --no-daemon --build-cache
        env:
          ORG_GRADLE_PROJECT_ptcrysUsername: ${{ secrets.PTCRYS_USERNAME }}
          ORG_GRADLE_PROJECT_ptcrysPassword: ${{ secrets.PTCRYS_PASSWORD }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
